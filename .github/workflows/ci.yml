name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality:
    name: Backend Quality (Ruff & Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Ruff Linter
        run: ruff check app/ tests/

      - name: Run Pytest
        env:
          DATABASE_URL: "sqlite:///:memory:"
          GEMINI_API_KEY: "mock_test_key_ai"
          SUPABASE_URL: "https://mock.supabase.co"
          SUPABASE_KEY: "mock_service_key"
          RESEND_API_KEY: "re_mock_test_key"
          FROM_EMAIL: "test@tahseel.local"
        run: pytest -v tests/

  frontend-quality:
    name: Frontend Quality (ESLint & Next.js Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Production Build
        run: npm run build

  docker-verification:
    name: Docker Build Verification
    needs: [backend-quality, frontend-quality]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker Compose Build
        run: docker compose build
